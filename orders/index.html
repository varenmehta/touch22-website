<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch22 Order Desk</title>
<meta name="description" content="Demo of the Touch22 order system: WhatsApp ordering in English, Hindi and Hinglish, automatic order numbers, factory routing, follow-ups and a simple dashboard.">
<link rel="icon" href="img/mono-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="orders.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#overview" aria-label="Touch22 Order Desk"><img src="img/word-dark.png" alt="Touch22"><span>Order<br>Desk</span></a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="clock">
      <span class="d" id="todayLbl"></span>
      <button class="btn sm soft" id="nextDay" type="button" title="Demo clock: jump to the next day to see follow-ups, delays and factory replies">Next day →</button>
      <button class="icon-btn" id="helpBtn" type="button" aria-label="How this demo works" title="How this demo works">?</button>
    </div>
  </div>
</header>
<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-orders"></section>
  <section class="view" id="v-chats"></section>
  <section class="view" id="v-reports"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Order details"></aside>
<div class="modal" id="help" role="dialog" aria-modal="true" aria-labelledby="helpT"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<script src="orders.js"></script>
</body>
</html>
