<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch22 Order Desk</title>
<meta name="description" content="Demo of the Touch22 order system: retailer WhatsApp bot in English, Hindi and Hinglish, automatic order numbers, factory routing, follow-ups and a live dashboard.">
<link rel="icon" href="img/mono-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="orders.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#dashboard" aria-label="Touch22 Order Desk home">
      <img src="img/logo-light.png" alt="Touch22">
      <span>Order Desk</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><b>Demo.</b> Sample data based on the T22 Order DB. WhatsApp and factory replies are simulated, nothing is sent.</div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="right">
        <span class="demo-tag">Simulated demo</span>
        <div class="today" title="Demo clock. Move to the next day to see follow-ups, delays and factory replies happen.">
          <span>Today <b id="todayLbl"></b></span>
          <button class="btn sm primary" id="nextDay" type="button">Next day ›</button>
        </div>
        <button class="btn sm ghost" id="resetBtn" type="button" title="Start the demo again from the sample data">Reset</button>
      </div>
    </header>
    <section class="view" id="v-dashboard"></section>
    <section class="view" id="v-orders"></section>
    <section class="view" id="v-bot"></section>
    <section class="view" id="v-factories"></section>
    <section class="view" id="v-followups"></section>
    <section class="view" id="v-insights"></section>
    <section class="view" id="v-how"></section>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Order details"></aside>
<div id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<script src="orders.js"></script>
</body>
</html>
